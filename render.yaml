# Render Blueprint for Vidyakshara (Full-Stack React + Express + PostgreSQL)
# Repository: https://github.com/rajendra-ai/Vidyakshara-App
services:
  - type: web
    name: vidyakshara-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vidyakshara-db
          property: connectionString

databases:
  - name: vidyakshara-db
    plan: free
    databaseName: vidyakshara
    user: vidyakshara_user
